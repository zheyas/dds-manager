
{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}ДДС Менеджер{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'style.css' %}">
  <style>
    html, body {
      height: 100%;
      min-height: 100vh;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #49bb43 0%, #f1de47 100%);
      color: #212529;
      font-family: 'Segoe UI', 'Roboto', Arial, sans-serif;
      display: flex;
      flex-direction: column;
    }
    .wrapper {
      flex: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .main-header {
      flex-shrink: 0;
      background: #fff;
      color: #212529;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e6e6e6;
      position: relative;
      z-index: 200;
    }
    .main-header .logo {
      font-weight: bold;
      font-size: 1.5rem;
      color: #269236;
      letter-spacing: 1px;
    }
    .main-header nav {
      display: flex;
      gap: 1rem;
    }
    .main-header nav a {
      color: #212529;
      text-decoration: none;
      font-weight: 500;
      font-size: 1.06rem;
      padding: 0.2rem 0.55rem;
      border-radius: 4px;
      transition: background 0.18s;
    }
    .main-header nav a:hover, .main-header nav a.active {
      background: #e5f6eb;
      text-decoration: underline;
    }
    .container {
      flex: 1 1 auto;
      max-width: 1100px;
      margin: 2rem auto 3.5rem auto;
      padding: 0 1rem;
      width: 100%;
      box-sizing: border-box;
      z-index: 10;
    }
    .main-footer {
      background: #247155;
      color: #fff;
      text-align: center;
      padding: 1rem 2rem;
      font-weight: 500;
      font-size: 16px;
      position: fixed;
      left: 0; right: 0; bottom: 0;
      z-index: 300;
      border-radius: 0 0 10px 10px;
      box-shadow: 0 -2px 12px #0002;
    }
    @media (max-width: 900px) {
      .container {
        max-width: 98vw;
        padding-left: 0.2rem;
        padding-right: 0.2rem;
      }
      .main-header {
        flex-direction: column;
        align-items: flex-start;
        padding-left: 1rem;
        padding-right: 1rem;
        gap: 0.6rem;
      }
      .main-header nav { gap: 0.5rem; }
    }
    @media (max-width: 600px) {
      .main-footer {
        font-size: 14px;
        padding: 8px 0.6rem;
      }
      .container {
        padding: 0 2vw;
      }
      .main-header { padding: 8px 6px; }
      .main-header .logo { font-size: 1.14rem;}
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <header class="main-header">
      <div class="logo">ДДС Менеджер</div>
      <nav>
        <a href="{% url 'home' %}">Главная</a>
        <a href="{% url 'cashflow_list' %}">Записи</a>
        <a href="{% url 'status_list' %}">Справочники</a>
        <a href="{% url 'profile' %}">Личный кабинет</a>
      </nav>
    </header>
    <div class="container">
      {% block content %}{% endblock %}
    </div>
    <footer class="main-footer">
      © 2025 ДДС Менеджер. Управление денежными средствами стало проще.
    </footer>
  </div>
</body>
</html>
